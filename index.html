<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ivan Lohvynenko — Portfolio</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<style>
/* ==========================================================================
   ТОКЕНЫ. Хочешь перекрасить сайт — меняешь только эти пять строк.
   ========================================================================== */
:root{
  --paper:  #E8E6E1;   /* фон */
  --ink:    #14332E;   /* основной текст, рамки */
  --blood:  #C81E12;   /* акцент: прицел, дырки, ховеры */
  --smoke:  #7E8B7F;   /* приглушённый текст */
  --void:   #0B0B0B;   /* чёрный: превьюшки, интро */

  --display: 'Anton', sans-serif;
  --mono:    'IBM Plex Mono', monospace;

  --pad: 5vw;          /* боковые поля секций */
}

*{ box-sizing:border-box; }
html{ scroll-behavior:smooth; }
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:var(--mono); overflow-x:hidden;
}
a{ color:var(--ink); text-decoration:none; }
::selection{ background:var(--blood); color:var(--paper); }
button{ font:inherit; color:inherit; }

/* прячем системный курсор, только на мышке */
@media (pointer:fine){
  body.nocursor, body.nocursor *{ cursor:none !important; }
}

/* --------------------------------------------------------------------------
   ОБЩЕЕ
   -------------------------------------------------------------------------- */
.wrap{ max-width:1280px; margin:0 auto; }
.section{ position:relative; padding:110px var(--pad) 150px; z-index:2; }
.eyebrow{
  margin:0 0 56px; font-size:11px; letter-spacing:.3em;
  text-transform:uppercase; color:var(--smoke);
}
.h2{
  margin:0 0 10px; font-family:var(--display); font-weight:400;
  font-size:clamp(40px,6vw,96px); line-height:.95; text-transform:uppercase;
}
/* вертикальная метка слева от секции */
.vlabel{
  position:absolute; left:14px; top:150px;
  writing-mode:vertical-rl; transform:rotate(180deg);
  font-size:11px; letter-spacing:.4em; text-transform:uppercase; color:var(--smoke);
}
.asterisk{ color:var(--blood); }

/* появление при скролле */
.reveal{ opacity:0; transform:translateY(28px); transition:opacity .8s ease, transform .8s ease; }
.reveal.in{ opacity:1; transform:none; }

/* --------------------------------------------------------------------------
   HERO
   -------------------------------------------------------------------------- */
.hero{ position:relative; min-height:100vh; display:flex; flex-direction:column; z-index:2; }
.hero-bar{
  display:flex; justify-content:space-between; align-items:baseline; gap:16px;
  padding:22px var(--pad) 14px; border-bottom:1px solid var(--ink);
  font-size:12px; letter-spacing:.28em; text-transform:uppercase;
}
.hero-bar span:last-child{ color:var(--smoke); }
.hero-body{
  position:relative; flex:1; display:flex; flex-direction:column;
  justify-content:center; padding:6vh 0 10vh var(--pad);
}
.hero-blob{
  position:absolute; right:-6vw; top:8%; width:min(52vw,640px); height:auto;
  mix-blend-mode:multiply; z-index:3; pointer-events:none;
}
.hero h1{
  margin:0; padding-top:.08em; position:relative; z-index:2;
  font-family:var(--display); font-weight:400;
  font-size:clamp(64px,15vw,230px); line-height:.9; letter-spacing:-.01em;
  text-transform:uppercase; white-space:nowrap;
  display:flex; flex-direction:column; gap:.06em;
}
.hero-sub{
  margin:5vh 0 0; position:relative; z-index:4;
  font-size:clamp(12px,1.2vw,15px); letter-spacing:.32em; text-transform:uppercase;
}
.hero-sub .loc{ color:var(--smoke); }
.hero-scroll{
  padding:0 var(--pad) 32px;
  font-size:11px; letter-spacing:.3em; text-transform:uppercase;
}
.caret{ display:inline-block; width:.7em; color:var(--blood); animation:blink 1s steps(1) infinite; }
@keyframes blink{ 0%,49%{opacity:1} 50%,100%{opacity:0} }
.star-hero{ position:absolute; right:8vw; bottom:9vh; z-index:4; }

/* --------------------------------------------------------------------------
   EXPERIENCE — аккордеон
   -------------------------------------------------------------------------- */
#experience{ padding-top:120px; padding-bottom:140px; }
.rows{ border-top:1px solid var(--ink); }
.row{ position:relative; border-bottom:1px solid var(--ink); }
.row-bar{
  position:absolute; left:0; top:0; bottom:0; width:3px; background:var(--blood);
  transform:scaleY(0); transform-origin:top; transition:transform .35s ease; z-index:1;
}
.row.open .row-bar{ transform:scaleY(1); }
.row-btn{
  position:relative; display:grid; align-items:baseline; width:100%; text-align:left;
  background:transparent; border:none; font-size:13px;
  grid-template-columns:clamp(86px,11vw,150px) 1fr auto;
  gap:clamp(10px,2.5vw,32px); padding:26px 12px 26px 22px;
}
.row-btn:hover{ background:rgba(20,51,46,.05); }
.row-btn:focus-visible{ outline:2px solid var(--blood); outline-offset:-2px; }
.row-years{ font-size:11px; letter-spacing:.18em; color:var(--smoke); }
.row-name{
  font-size:clamp(16px,2.2vw,26px); font-weight:600; letter-spacing:.12em;
  text-transform:uppercase; transition:color .15s; overflow-wrap:anywhere;
}
.row-role{
  font-size:11px; letter-spacing:.22em; text-transform:uppercase;
  color:var(--smoke); text-align:right;
}
.row-detail{ display:grid; grid-template-rows:0fr; transition:grid-template-rows .45s cubic-bezier(.4,0,.2,1); }
.row.open .row-detail{ grid-template-rows:1fr; }
.row-detail > div{ overflow:hidden; min-height:0; }
.row-inner{ padding:6px 22px 40px; max-width:760px; display:flex; flex-direction:column; gap:18px; }
.row-inner p{ margin:0; font-size:13px; line-height:1.75; letter-spacing:.03em; }
.row-did .arrow{ color:var(--blood); }
.row-inner ul{ margin:0; padding:0; list-style:none; display:flex; flex-direction:column; gap:8px; }
.row-inner li{ position:relative; padding-left:18px; font-size:12px; line-height:1.7; letter-spacing:.04em; }
.row-inner li::before{ content:"—"; position:absolute; left:0; color:var(--blood); }
.tags{ display:flex; flex-wrap:wrap; gap:8px; margin-top:4px; }
.tag{
  border:1px solid var(--ink); padding:5px 10px;
  font-size:10px; letter-spacing:.2em; text-transform:uppercase;
}

/* --------------------------------------------------------------------------
   PROJECTS — разбросанные карточки
   -------------------------------------------------------------------------- */
.divider{ display:block; width:100%; height:90px; }
.cards{ position:relative; display:flex; flex-wrap:wrap; justify-content:center; align-items:flex-start; padding-bottom:20px; }
.card{
  position:relative; text-align:left; background:var(--paper); border:1px solid var(--ink);
  padding:16px 16px 22px;
  transition:transform .25s cubic-bezier(.3,.9,.3,1), box-shadow .25s;
}
.card:hover{ transform:rotate(0deg) translateY(-10px) !important; box-shadow:10px 14px 0 rgba(11,11,11,.16); z-index:9; }
.card:focus-visible{ outline:2px solid var(--blood); outline-offset:4px; }
.card img, .card svg.thumb{ display:block; width:100%; height:auto; border:1px solid var(--ink); }
.card-name{
  display:block; margin-top:16px; font-family:var(--display); font-size:26px;
  line-height:1; text-transform:uppercase; letter-spacing:.02em; transition:color .15s;
}
.card-stack{
  display:block; margin-top:8px; font-size:10px; letter-spacing:.22em;
  text-transform:uppercase; color:var(--smoke);
}
/* уголки-рамка на ховере */
.corner{ position:absolute; width:15px; height:15px; opacity:0; transition:opacity .12s; }
.card:hover .corner{ opacity:1; }
.corner.tl{ left:-7px; top:-7px;    border-left:1px solid var(--blood); border-top:1px solid var(--blood); }
.corner.tr{ right:-7px; top:-7px;   border-right:1px solid var(--blood); border-top:1px solid var(--blood); }
.corner.bl{ left:-7px; bottom:-7px; border-left:1px solid var(--blood); border-bottom:1px solid var(--blood); }
.corner.br{ right:-7px; bottom:-7px;border-right:1px solid var(--blood); border-bottom:1px solid var(--blood); }
.star-proj{ position:absolute; left:9vw; bottom:60px; }

/* --------------------------------------------------------------------------
   CONTACT
   -------------------------------------------------------------------------- */
#contact{ border-top:1px solid var(--ink); padding-bottom:160px; }
.links{ display:flex; flex-direction:column; gap:8px; align-items:flex-start; }
.link{
  position:relative; display:inline-block; font-family:var(--display);
  font-size:clamp(38px,6.5vw,104px); line-height:1.05; text-transform:uppercase;
}
.link:focus-visible{ outline:2px solid var(--blood); outline-offset:4px; }
.link .strike{
  position:absolute; left:0; top:52%; width:100%; height:5px; background:var(--blood);
  transform:scaleX(0); transform-origin:left center;
  transition:transform .3s cubic-bezier(.4,0,.2,1);
}
.link:hover .strike, .link:focus-visible .strike{ transform:scaleX(1); }
.link .val{
  font-family:var(--mono); font-size:11px; letter-spacing:.25em;
  color:var(--smoke); margin-left:18px; vertical-align:super;
}
.footer{ margin:80px 0 0; font-size:10px; letter-spacing:.3em; text-transform:uppercase; color:var(--smoke); }

/* --------------------------------------------------------------------------
   МОДАЛКА
   -------------------------------------------------------------------------- */
.modal{
  position:fixed; inset:0; z-index:200; background:rgba(11,11,11,.55);
  display:flex; align-items:center; justify-content:center; padding:24px;
}
.modal[hidden]{ display:none; }
.modal-box{
  position:relative; background:var(--paper); border:1px solid var(--ink);
  width:min(680px,94vw); max-height:86vh; overflow:auto; padding:clamp(24px,4vw,48px);
}
.mc{ position:absolute; width:18px; height:18px; }
.mc.tl{ left:8px; top:8px;     border-left:2px solid var(--blood); border-top:2px solid var(--blood); }
.mc.tr{ right:8px; top:8px;    border-right:2px solid var(--blood); border-top:2px solid var(--blood); }
.mc.bl{ left:8px; bottom:8px;  border-left:2px solid var(--blood); border-bottom:2px solid var(--blood); }
.mc.br{ right:8px; bottom:8px; border-right:2px solid var(--blood); border-bottom:2px solid var(--blood); }
.modal-head{ display:flex; justify-content:space-between; align-items:flex-start; gap:16px; }
.modal-tag{ font-size:10px; letter-spacing:.3em; text-transform:uppercase; color:var(--blood); }
.modal-close{
  background:transparent; border:1px solid var(--ink); padding:8px 14px;
  font-size:10px; letter-spacing:.25em; text-transform:uppercase;
}
.modal-close:hover{ background:var(--ink); color:var(--paper); }
.modal-close:focus-visible{ outline:2px solid var(--blood); outline-offset:2px; }
.modal-box h3{
  margin:18px 0 6px; font-family:var(--display); font-weight:400;
  font-size:clamp(34px,5vw,64px); line-height:.95; text-transform:uppercase;
}
.modal-stack{ margin:0 0 22px; font-size:11px; letter-spacing:.25em; text-transform:uppercase; color:var(--smoke); }
.modal-desc{ margin:0 0 28px; font-size:13px; line-height:1.8; letter-spacing:.03em; }
.modal-btns{ display:flex; gap:12px; flex-wrap:wrap; }
.btn{
  display:inline-block; border:1px solid var(--ink); padding:14px 32px;
  font-size:11px; letter-spacing:.28em; text-transform:uppercase;
}
.btn-solid{ background:var(--ink); color:var(--paper); }
.btn-solid:hover{ background:var(--blood); border-color:var(--blood); color:var(--paper); }
.btn-ghost{ background:transparent; }
.btn-ghost:hover{ background:var(--ink); color:var(--paper); }
.btn:focus-visible{ outline:2px solid var(--blood); outline-offset:3px; }

/* --------------------------------------------------------------------------
   ЭФФЕКТЫ: линейка, прицел, курсор, дырки, зерно, интро
   -------------------------------------------------------------------------- */
#splats{ position:absolute; inset:0; z-index:1; pointer-events:none; overflow:hidden; }
#ruler{
  position:fixed; left:0; top:0; bottom:0; width:16px; z-index:5; pointer-events:none;
  background-image:
    repeating-linear-gradient(180deg, rgba(20,51,46,.45) 0 1px, transparent 1px 24px),
    repeating-linear-gradient(180deg, rgba(200,30,18,.6) 0 1px, transparent 1px 120px);
  background-size:7px 100%, 14px 100%;
  background-repeat:no-repeat;
}
#crosshair{ position:fixed; inset:0; z-index:1; pointer-events:none; overflow:hidden; }
#ch-h{ position:absolute; left:0; right:0; top:0; height:1px; background:var(--blood); opacity:.55; }
#ch-v{ position:absolute; top:0; bottom:0; left:0; width:1px; background:var(--blood); opacity:.55; }
#ch-ht{
  position:absolute; left:0; right:0; top:0; height:7px; margin-top:-3px; opacity:.55;
  background:repeating-linear-gradient(90deg, transparent 0 79px, rgba(200,30,18,.5) 79px 80px);
}
#ch-vt{
  position:absolute; top:0; bottom:0; left:0; width:7px; margin-left:-3px; opacity:.55;
  background:repeating-linear-gradient(180deg, transparent 0 79px, rgba(200,30,18,.5) 79px 80px);
}
#ch-c{
  position:absolute; left:0; top:0; width:180px; height:180px;
  border:1px solid var(--blood); border-radius:50%; opacity:.7;
}
#ch-c span{ position:absolute; background:var(--blood); }
#ch-c span:nth-child(1){ left:50%; top:-8px;    width:1px; height:14px; }
#ch-c span:nth-child(2){ left:50%; bottom:-8px; width:1px; height:14px; }
#ch-c span:nth-child(3){ top:50%; left:-8px;    height:1px; width:14px; }
#ch-c span:nth-child(4){ top:50%; right:-8px;   height:1px; width:14px; }

#cursor{ position:fixed; left:0; top:0; z-index:400; pointer-events:none; display:none; }
#cursor span{ position:absolute; background:var(--blood); }
#cursor span:nth-child(1){ left:-3px; top:-3px; width:6px; height:6px; border-radius:50%; }
#cursor span:nth-child(2){ left:-7px; top:0; width:14px; height:1px; }
#cursor span:nth-child(3){ left:0; top:-7px; width:1px; height:14px; }

#ring{
  position:fixed; left:0; top:0; z-index:399; pointer-events:none; display:none;
  width:44px; height:44px; margin:-22px 0 0 -22px;
  border:1px solid var(--blood); border-radius:50%;
  opacity:0; transform:scale(1.6) rotate(45deg);
  transition:transform .18s cubic-bezier(.2,.9,.3,1), opacity .12s, background .06s;
}
#ring b{ position:absolute; width:12px; height:12px; opacity:0; transition:transform .16s, opacity .12s; }
#ring b:nth-child(1){ left:-12px; top:-12px;    border-left:1px solid var(--blood); border-top:1px solid var(--blood);    transform:translate(-10px,-10px); }
#ring b:nth-child(2){ right:-12px; top:-12px;   border-right:1px solid var(--blood); border-top:1px solid var(--blood);   transform:translate(10px,-10px); }
#ring b:nth-child(3){ left:-12px; bottom:-12px; border-left:1px solid var(--blood); border-bottom:1px solid var(--blood); transform:translate(-10px,10px); }
#ring b:nth-child(4){ right:-12px; bottom:-12px;border-right:1px solid var(--blood); border-bottom:1px solid var(--blood);transform:translate(10px,10px); }
#ring.hot{ opacity:1; transform:scale(1) rotate(0deg); }
#ring.hot b{ opacity:1; transform:translate(0,0); }

#intro{ position:fixed; inset:0; z-index:350; pointer-events:none; display:none; background:var(--void); }
#grain{ position:fixed; inset:0; z-index:300; pointer-events:none; opacity:.08; mix-blend-mode:multiply; }

/* --------------------------------------------------------------------------
   МОБИЛКА
   -------------------------------------------------------------------------- */
@media (max-width:768px){
  .vlabel, #ruler, #crosshair{ display:none; }
  .row-btn{ grid-template-columns:1fr; gap:7px; padding:20px 14px 20px 18px; }
  .row-role{ text-align:left; }
  .card{ width:100% !important; max-width:440px; transform:none !important; margin:0 0 26px !important; }
  .card:hover{ transform:translateY(-6px) !important; }
}

/* --------------------------------------------------------------------------
   ЛЮДИ, КОТОРЫЕ НЕ ЛЮБЯТ АНИМАЦИЮ
   -------------------------------------------------------------------------- */
@media (prefers-reduced-motion:reduce){
  *{ animation:none !important; }
  .reveal{ opacity:1 !important; transform:none !important; transition:none !important; }
  #ring{ transition:none !important; }
  #ring b{ transition:none !important; }
}
</style>
</head>

<body>

<!-- ============================================================ HERO ==== -->
<header class="hero">
  <div class="hero-bar">
    <span id="brand"></span>
    <span>Portfolio</span>
  </div>

  <div class="hero-body">
    <svg class="hero-blob" viewBox="0 0 520 460" aria-hidden="true">
      <path d="M38,84 L142,22 L198,58 L296,10 L342,66 L458,34 L512,118 L470,196 L508,262 L432,318 L466,398 L346,382 L302,446 L204,396 L118,438 L96,340 L14,306 L58,224 L10,158 Z" fill="var(--blood)"/>
    </svg>
    <h1 id="hero-name"></h1>
    <p class="hero-sub">
      <span id="hero-role"></span>
      <span class="asterisk">///</span>
      <span class="loc" id="hero-loc"></span>
    </p>
  </div>

  <div class="hero-scroll">Scroll<span class="caret">▌</span></div>

  <svg class="star-hero" width="46" height="46" viewBox="0 0 46 46" aria-hidden="true">
    <g stroke="var(--blood)" stroke-width="3">
      <line x1="23" y1="2" x2="23" y2="44"/><line x1="2" y1="23" x2="44" y2="23"/>
      <line x1="8" y1="8" x2="38" y2="38"/><line x1="38" y1="8" x2="8" y2="38"/>
    </g>
  </svg>
</header>

<!-- ====================================================== EXPERIENCE ==== -->
<section class="section" id="experience">
  <span class="vlabel">01 / Experience</span>
  <div class="wrap reveal">
    <h2 class="h2">Companies <span class="asterisk">*</span></h2>
    <p class="eyebrow">01 / Experience — select a row to expand</p>
    <div class="rows" id="rows"></div>
  </div>
</section>

<svg class="divider" viewBox="0 0 1440 110" preserveAspectRatio="none" aria-hidden="true">
  <path d="M0,70 L96,44 L180,76 L290,30 L372,62 L488,24 L560,58 L700,18 L780,66 L900,36 L1010,72 L1120,28 L1230,60 L1340,34 L1440,58 L1440,110 L0,110 Z" fill="var(--blood)"/>
</svg>

<!-- ======================================================== PROJECTS ==== -->
<section class="section" id="projects">
  <span class="vlabel">02 / Projects</span>
  <div class="wrap">
    <h2 class="h2 reveal">Pet Projects</h2>
    <p class="eyebrow">02 / Projects — click a card for the dossier</p>
    <div class="cards reveal" id="cards"></div>
  </div>
  <svg class="star-proj" width="34" height="34" viewBox="0 0 46 46" aria-hidden="true">
    <g stroke="var(--blood)" stroke-width="3">
      <line x1="23" y1="2" x2="23" y2="44"/><line x1="2" y1="23" x2="44" y2="23"/>
      <line x1="8" y1="8" x2="38" y2="38"/><line x1="38" y1="8" x2="8" y2="38"/>
    </g>
  </svg>
</section>

<!-- ========================================================= CONTACT ==== -->
<section class="section" id="contact">
  <span class="vlabel">03 / Contact</span>
  <div class="wrap reveal">
    <p class="eyebrow" style="margin-bottom:40px">03 / Contact</p>
    <div class="links" id="links"></div>
    <p class="footer" id="footer"></p>
  </div>
</section>

<!-- =========================================================== МОДАЛКА == -->
<div class="modal" id="modal" role="dialog" aria-modal="true" hidden>
  <div class="modal-box" id="modal-box">
    <span class="mc tl"></span><span class="mc tr"></span>
    <span class="mc bl"></span><span class="mc br"></span>
    <div class="modal-head">
      <span class="modal-tag" id="m-tag"></span>
      <button class="modal-close" id="m-close">✕ Close</button>
    </div>
    <h3 id="m-name"></h3>
    <p class="modal-stack" id="m-stack"></p>
    <p class="modal-desc" id="m-desc"></p>
    <div class="modal-btns" id="m-btns"></div>
  </div>
</div>

<!-- ========================================================== ЭФФЕКТЫ === -->
<div id="splats" aria-hidden="true"></div>
<div id="ruler" aria-hidden="true"></div>

<div id="crosshair" aria-hidden="true">
  <div id="ch-h"></div><div id="ch-ht"></div>
  <div id="ch-v"></div><div id="ch-vt"></div>
  <div id="ch-c"><span></span><span></span><span></span><span></span></div>
</div>

<div id="cursor" aria-hidden="true"><span></span><span></span><span></span></div>
<div id="ring" aria-hidden="true"><b></b><b></b><b></b><b></b></div>
<div id="intro" aria-hidden="true"></div>

<div id="grain" aria-hidden="true">
  <svg width="100%" height="100%">
    <filter id="noise">
      <feTurbulence type="fractalNoise" baseFrequency="0.82" numOctaves="2" stitchTiles="stitch"/>
    </filter>
    <rect width="100%" height="100%" filter="url(#noise)"/>
  </svg>
</div>

<script>
/* ============================================================================
 *
 *   ██  ПРАВИТЬ ТУТ  ██   Всё содержимое сайта — в одном объекте DATA.
 *                          Ниже, под чертой, — движок. Его трогать не надо.
 *
 * ========================================================================== */

const DATA = {

  /* --- Шапка ------------------------------------------------------------- */
  name:    "Ivan Lohvynenko",   // если имя длинное — h1 в CSS ставит nowrap, следи
  nameLines: ["Ivan", "Lohvynenko"],  // как разбить на строки в hero
  role:    "L1/L2 Technical Support → DevOps",
  location: "Kyiv, UA",
  footer:  "© 2026 Ivan Lohvynenko ✳,

  /* --- Опыт работы ------------------------------------------------------- *
   * years   — что слева
   * name    — название компании
   * role    — должность (справа)
   * about   — что за компания
   * did     — одна фраза: чем ты там занимался
   * bullets — конкретика, 2-4 пункта
   * tags    — стек
   * ----------------------------------------------------------------------- */
  companies: [
    {
      years: "2026 — NOW",
      name: "freehost.com.ua",
      role: "Technical Support L1",

/* ============================================================================
 * ─────────────────────────────────────────────────────────────────────────────
 *   ДВИЖОК. Ниже — рендер и эффекты. Обычно сюда лезть не надо.
 * ─────────────────────────────────────────────────────────────────────────────
 * ========================================================================== */

const $  = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));

const mqMobile  = matchMedia("(max-width: 768px)");
const mqReduced = matchMedia("(prefers-reduced-motion: reduce)");
const mqFine    = matchMedia("(pointer: fine)");

/* ---------------------------------------------------------------- РЕНДЕР -- */

function renderHero() {
  $("#brand").textContent = DATA.name;
  $("#hero-name").innerHTML = DATA.nameLines.map(l => `<span>${esc(l)}</span>`).join("");
  $("#hero-role").textContent = DATA.role;
  $("#hero-loc").textContent  = DATA.location;
  $("#footer").textContent    = DATA.footer;
  document.title = `${DATA.name} — Portfolio`;
}

function renderCompanies() {
  $("#rows").innerHTML = DATA.companies.map((c, i) => `
    <div class="row" data-row="${i}">
      <span class="row-bar"></span>
      <button class="row-btn hot" aria-expanded="false">
        <span class="row-years">${esc(c.years)}</span>
        <span class="row-name hotlabel">${esc(c.name)}</span>
        <span class="row-role">${esc(c.role)}</span>
      </button>
      <div class="row-detail">
        <div>
          <div class="row-inner">
            <p>${esc(c.about)}</p>
            <p class="row-did"><span class="arrow">&gt;&gt;</span> ${esc(c.did)}</p>
            <ul>${c.bullets.map(b => `<li>${esc(b)}</li>`).join("")}</ul>
            <div class="tags">${c.tags.map(t => `<span class="tag">${esc(t)}</span>`).join("")}</div>
          </div>
        </div>
      </div>
    </div>`).join("");

  $$("#rows .row").forEach(row => {
    const btn = $(".row-btn", row);
    btn.addEventListener("click", () => {
      const open = row.classList.toggle("open");
      btn.setAttribute("aria-expanded", String(open));
      // закрываем остальные
      $$("#rows .row").forEach(o => {
        if (o !== row) { o.classList.remove("open"); $(".row-btn", o).setAttribute("aria-expanded", "false"); }
      });
    });
  });
}

function thumb(p, i) {
  if (p.img) return `<img src="${esc(p.img)}" alt="">`;
  const num = String(i + 1).padStart(2, "0");
  return `
    <svg class="thumb" viewBox="0 0 320 190" aria-hidden="true">
      <filter id="duo-${i}" x="0" y="0" width="100%" height="100%">
        <feTurbulence type="fractalNoise" baseFrequency="${p.freq}" numOctaves="3" seed="${p.seed}"/>
        <feColorMatrix type="saturate" values="0"/>
        <feComponentTransfer>
          <feFuncR type="discrete" tableValues="0.043 0.494"/>
          <feFuncG type="discrete" tableValues="0.043 0.545"/>
          <feFuncB type="discrete" tableValues="0.043 0.498"/>
          <feFuncA type="discrete" tableValues="1 1"/>
        </feComponentTransfer>
      </filter>
      <rect width="320" height="190" fill="#0B0B0B"/>
      <rect width="320" height="190" filter="url(#duo-${i})"/>
      <text x="14" y="176" fill="#E8E6E1" font-family="IBM Plex Mono, monospace"
            font-size="10" letter-spacing="3">[IMG_${num}]</text>
    </svg>`;
}

function renderProjects() {
  const scatter = DATA.fx.scatterProjects && !mqMobile.matches;
  $("#cards").innerHTML = DATA.projects.map((p, i) => {
    const style = scatter
      ? `width:${p.w}px; transform:rotate(${p.rot}deg); margin:${p.mt}px ${p.mx}px 34px;`
      : `width:100%; max-width:440px; margin:0 0 26px;`;
    return `
      <button class="card hot" data-card="${i}" style="${style}">
        <span class="corner tl"></span><span class="corner tr"></span>
        <span class="corner bl"></span><span class="corner br"></span>
        ${thumb(p, i)}
        <span class="card-name hotlabel">${esc(p.name)}</span>
        <span class="card-stack">${esc(p.stack)}</span>
      </button>`;
  }).join("");

  $$("#cards .card").forEach(c =>
    c.addEventListener("click", () => openModal(+c.dataset.card))
  );
}

function renderContacts() {
  $("#links").innerHTML = DATA.contacts.map(k => `
    <a class="link hot" href="${esc(k.href)}" target="_blank" rel="noopener">
      ${esc(k.label)}<span class="strike"></span>
      <span class="val">${esc(k.value)}</span>
    </a>`).join("");
}

/* ---------------------------------------------------------------- МОДАЛКА - */

const modal = $("#modal");
let lastFocused = null;

function openModal(i) {
  const p = DATA.projects[i];
  lastFocused = document.activeElement;
  $("#m-tag").textContent   = `Target // ${String(i + 1).padStart(2, "0")}`;
  $("#m-name").textContent  = p.name;
  $("#m-stack").textContent = p.stack;
  $("#m-desc").textContent  = p.desc;
  $("#m-btns").innerHTML = (p.links || []).map(l =>
    `<a class="btn ${l.solid ? "btn-solid" : "btn-ghost"} hot"
        href="${esc(l.href)}" target="_blank" rel="noopener">${esc(l.label)}</a>`
  ).join("");
  modal.hidden = false;
  $("#m-close").focus();
}

function closeModal() {
  modal.hidden = true;
  if (lastFocused) lastFocused.focus();
}

$("#m-close").addEventListener("click", closeModal);
modal.addEventListener("click", e => { if (e.target === modal) closeModal(); });
document.addEventListener("keydown", e => { if (e.key === "Escape" && !modal.hidden) closeModal(); });

/* ------------------------------------------------------- ПРИЦЕЛ + КУРСОР - */

const ring = $("#ring"), cursor = $("#cursor"), chLayer = $("#crosshair");
let tx = innerWidth / 2, ty = innerHeight / 2;   // цель (мышь)
let chx = tx, chy = ty;                           // прицел (с лагом)
let rx = tx, ry = ty;                             // кольцо
let introRunning = false;

function paintCrosshair(x, y) {
  $("#ch-h").style.transform  = `translateY(${y}px)`;
  $("#ch-ht").style.transform = `translateY(${y}px)`;
  $("#ch-v").style.transform  = `translateX(${x}px)`;
  $("#ch-vt").style.transform = `translateX(${x}px)`;
  $("#ch-c").style.transform  = `translate(${x - 90}px, ${y - 90}px)`;
}

document.addEventListener("mousemove", e => {
  tx = e.clientX; ty = e.clientY;
  cursor.style.transform = `translate(${tx}px, ${ty}px)`;
});

(function loop() {
  requestAnimationFrame(loop);
  const follow = DATA.fx.crosshairFollow && !mqMobile.matches && !mqReduced.matches;
  if (follow && !introRunning) {
    chx += (tx - chx) * 0.08;
    chy += (ty - chy) * 0.08;
    paintCrosshair(chx, chy);
  }
  if (!mqMobile.matches) {
    const k = mqReduced.matches ? 1 : 0.35;
    rx += (tx - rx) * k;
    ry += (ty - ry) * k;
    ring.style.left = rx + "px";
    ring.style.top  = ry + "px";
  }
})();

/* «горячие» элементы: прицел прячется, кольцо схлопывается */
let hot = null, flashT;
function setHot(el, on) {
  if (chLayer) {
    chLayer.style.transition = mqReduced.matches ? "none" : "opacity .2s ease";
    chLayer.style.opacity = on ? "0" : "1";
  }
  $$(".hotlabel", el).forEach(l => l.style.color = on ? "var(--blood)" : "");
  ring.classList.toggle("hot", on);
  if (on && !mqReduced.matches) {
    ring.style.background = "rgba(200,30,18,.35)";
    clearTimeout(flashT);
    flashT = setTimeout(() => ring.style.background = "transparent", 70);
  }
  if (!on) ring.style.background = "transparent";
}
document.addEventListener("mouseover", e => {
  const el = e.target.closest?.(".hot");
  if (el && el !== hot) { if (hot) setHot(hot, false); hot = el; setHot(el, true); }
});
document.addEventListener("mouseout", e => {
  const el = e.target.closest?.(".hot");
  if (el && el === hot && !(e.relatedTarget && el.contains(e.relatedTarget))) {
    setHot(el, false); hot = null;
  }
});

/* ------------------------------------------------------------ ДЫРКИ ОТ ПУЛЬ */

document.addEventListener("click", e => {
  if (!DATA.fx.bulletHoles) return;
  if (mqMobile.matches || !mqFine.matches) return;
  if (!modal.hidden) return;
  if (e.target.closest?.(".hot, a, button, input, textarea, select")) return;

  const box = $("#splats");
  const size = 34 + Math.random() * 46;
  const spikes = 9 + Math.floor(Math.random() * 4);
  const pts = [];
  for (let i = 0; i < spikes * 2; i++) {
    const ang = (Math.PI * i) / spikes + Math.random() * 0.35;
    const rad = i % 2 === 0 ? 44 : 20 + Math.random() * 14;
    pts.push(`${(50 + Math.cos(ang) * rad).toFixed(1)},${(50 + Math.sin(ang) * rad).toFixed(1)}`);
  }

  const r = box.getBoundingClientRect();
  const s = document.createElement("div");
  const rot = Math.random() * 360;
  s.style.cssText = `position:absolute; left:${e.clientX - r.left - size/2}px; top:${e.clientY - r.top - size/2}px;
                     width:${size}px; height:${size}px; opacity:.95;
                     transform:rotate(${rot}deg) scale(${mqReduced.matches ? 1 : 0.3});`;
  s.innerHTML = `<svg viewBox="0 0 100 100" width="100%" height="100%">
    <polygon points="${pts.join(" ")}" fill="var(--blood)"/>
    <circle cx="50" cy="50" r="7" fill="var(--void)"/></svg>`;
  box.appendChild(s);

  if (!mqReduced.matches) {
    s.style.transition = "transform .12s cubic-bezier(.2,1.6,.4,1)";
    requestAnimationFrame(() => s.style.transform = `rotate(${rot}deg) scale(1)`);
    // отдача
    const kick = Math.random() * 0.6 - 0.3;
    chx += Math.sin(kick) * 60; chy -= 40 + Math.random() * 30;
    rx  += Math.sin(kick) * 30; ry -= 25;
    ring.style.opacity = "1";
    ring.style.background = "rgba(200,30,18,.4)";
    setTimeout(() => {
      if (!hot) ring.style.opacity = "0";
      ring.style.background = "transparent";
    }, 90);
  }

  if (box.children.length > 40) box.removeChild(box.firstChild);
});

/* --------------------------------------------------------- ИНТРО-ПРОЖЕКТОР */

function runIntro() {
  if (!DATA.fx.introSweep || mqMobile.matches || mqReduced.matches) return;
  const ov = $("#intro");
  introRunning = true;
  ov.style.display = "block";
  ov.style.opacity = "1";

  const r = $("#hero-name").getBoundingClientRect();
  const target = { x: Math.min(r.left + r.width * 0.3, innerWidth * 0.65), y: r.top + r.height / 2 };
  const path = [
    { x: innerWidth * 0.78, y: innerHeight * 0.72, t: 0 },
    { x: innerWidth * 0.22, y: innerHeight * 0.55, t: 1000 },
    { x: innerWidth * 0.60, y: innerHeight * 0.22, t: 1900 },
    { x: target.x, y: target.y, t: 2700 },
    { x: target.x, y: target.y, t: 3400 }
  ];
  const RAD = 150;
  const ease = t => t < 0.5 ? 2*t*t : 1 - Math.pow(-2*t + 2, 2) / 2;
  const mask = (x, y) => {
    const m = `radial-gradient(circle at ${x}px ${y}px, transparent 0, transparent ${RAD-16}px, black ${RAD}px)`;
    ov.style.webkitMaskImage = m; ov.style.maskImage = m;
  };

  const t0 = performance.now();
  (function step(now) {
    const el = now - t0;
    if (el >= path.at(-1).t) {
      ov.style.transition = "opacity .8s ease";
      ov.style.opacity = "0";
      setTimeout(() => { ov.style.display = "none"; introRunning = false; }, 850);
      return;
    }
    let i = 0;
    while (i < path.length - 2 && el > path[i + 1].t) i++;
    const a = path[i], b = path[i + 1];
    const f = ease(Math.min(1, (el - a.t) / (b.t - a.t)));
    const x = a.x + (b.x - a.x) * f, y = a.y + (b.y - a.y) * f;
    chx = x; chy = y;
    paintCrosshair(x, y);
    mask(x, y);
    requestAnimationFrame(step);
  })(performance.now());

  mask(path[0].x, path[0].y);
  paintCrosshair(path[0].x, path[0].y);
}

/* ------------------------------------------------------- ПОЯВЛЕНИЕ ПО СКРОЛЛУ */

function setupReveal() {
  if (mqReduced.matches) { $$(".reveal").forEach(e => e.classList.add("in")); return; }
  const io = new IntersectionObserver(entries => {
    entries.forEach(en => {
      if (en.isIntersecting) { en.target.classList.add("in"); io.unobserve(en.target); }
    });
  }, { threshold: 0.08 });
  $$(".reveal").forEach(e => io.observe(e));
}

/* --------------------------------------------------------------- РЕЖИМЫ --- */

function applyMode() {
  const useCursor = mqFine.matches && !mqMobile.matches;
  document.body.classList.toggle("nocursor", useCursor);
  cursor.style.display = useCursor ? "block" : "none";
  ring.style.display   = useCursor ? "block" : "none";
  $("#grain").style.opacity = String(DATA.fx.grainOpacity);
  if (mqMobile.matches || mqReduced.matches) {
    chx = innerWidth / 2; chy = innerHeight / 2;
    paintCrosshair(chx, chy);
  }
}

/* ------------------------------------------------------------------ СТАРТ - */

renderHero();
renderCompanies();
renderProjects();
renderContacts();
setupReveal();
applyMode();
runIntro();

mqMobile.addEventListener("change", () => { renderProjects(); applyMode(); });
mqReduced.addEventListener("change", applyMode);
</script>
